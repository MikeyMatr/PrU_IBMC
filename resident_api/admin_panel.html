<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления ЖЭУ</title>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 20px auto; background: #f4f7f6; }
        .plea-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .info { flex-grow: 1; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .new { background: #ffeeba; color: #856404; }
        .in_progress { background: #b8daff; color: #004085; }
        .completed { background: #c3e6cb; color: #155724; }
        select { padding: 5px; margin-left: 10px; }
        button { cursor: pointer; padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; }
        .stats-container { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-card { 
            background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 150px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; border-bottom: 4px solid #ddd;
        }
        .stat-card h2 { margin: 0; font-size: 2em; color: #333; }
        .stat-card p { margin: 5px 0 0; color: #666; font-size: 0.9em; text-transform: uppercase; }
        .card-new { border-color: #ffc107; }
        .card-progress { border-color: #007bff; }
        .card-completed { border-color: #28a745; }
    </style>
</head>
<body>
    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3>Опубликовать новость</h3>
        <input type="text" id="newsTitle" placeholder="Заголовок новости" style="width: 98%; padding: 10px; margin-bottom: 10px;">
        <textarea id="newsContent" placeholder="Текст новости..." style="width: 98%; padding: 10px; height: 80px; margin-bottom: 10px;"></textarea>
        <button onclick="createNews()" style="background: #28a745; width: 100%;">Опубликовать для жителей</button>
    </div>
    <div class="stats-container">
    <div class="stat-card card-new">
        <h2 id="statNew">0</h2>
        <p>Новые заявки</p>
    </div>
    <div class="stat-card card-progress">
        <h2 id="statProgress">0</h2>
        <p>В работе</p>
    </div>
    <div class="stat-card card-completed">
        <h2 id="statCompletedToday">0</h2>
        <p>Завершено сегодня</p>
    </div>
    <div class="stat-card">
        <h2 id="statTotal">0</h2>
        <p>Всего заявок</p>
    </div>
    </div>
    <h2>Все заявки жителей (Диспетчер)</h2>
    <div id="allPleasList">Загрузка...</div>

    <script>
        const API_URL = 'http://ip_here/api/';
        const accessToken = localStorage.getItem('access');
        const role = localStorage.getItem('role');

        if (!accessToken || role === 'resident') {
                alert("Доступ запрещен!");
                window.location.href = 'index.html';
        }

        async function fetchAllPleas() {
            try {
                const response = await fetch(API_URL + 'pleas/', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });

                // Если сервер ответил ошибкой (404, 500 и т.д.)
                if (!response.ok) {
                    const rawText = await response.text(); // Читаем как текст, а не JSON
                    console.error("Сырой ответ сервера:", rawText);
                    
                    // Если в ответе есть слово "not found", значит неверный URL
                    if (response.status === 404) {
                        throw new Error("Адрес /api/pleas/ не найден (404). Проверьте urls.py и наличие слэша в конце.");
                    }
                    throw new Error(`Ошибка сервера ${response.status}. Проверьте терминал Django.`);
                }

                const pleas = await response.json();
                renderPleas(pleas);
            } catch (err) {
                document.getElementById('allPleasList').innerHTML = 
                    `<div style="color:red; padding:20px; border:1px solid red; background: #fff5f5;">
                        <b>Ошибка:</b> ${err.message}
                    </div>`;
                console.error(err);
            }
        }

        function renderPleas(pleas) {
            let html = '';
            pleas.forEach(p => {
                // Определяем текст категории для отображения
                const categoryName = p.category === 'plumber' ? 'Сантехник' : 'Электрик';
                
                html += `
                    <div class="plea-card">
                        <div class="info">
                            <!-- Бейдж со статусом (сохраняем ваши стили) -->
                            <span class="status-badge ${p.status}">${p.status_display}</span>
                            
                            <strong>#${p.id} — ${categoryName}</strong>
                            
                            <div style="margin-top: 10px; font-size: 0.95em;">
                                <!-- Добавляем информацию о месте -->
                                <p style="margin: 3px 0;">📍 <b>Адрес:</b> ${p.address || 'не указан'}</p>
                                <p style="margin: 3px 0;">🏢 <b>Квартира:</b> ${p.apartment || '-'}</p>
                                <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                                <p style="margin: 3px 0;">👤 <b>Житель:</b> ${p.resident}</p>
                                <p style="margin: 5px 0; color: #333;">📝 <b>Проблема:</b> ${p.description}</p>
                            </div>
                        </div>

                        <div class="actions">
                            <label style="font-size: 0.8em; color: #666;">Сменить статус:</label><br>
                            <select onchange="updateStatus(${p.id}, this.value)">
                                <option value="new" ${p.status === 'new' ? 'selected' : ''}>Новая</option>
                                <option value="in_progress" ${p.status === 'in_progress' ? 'selected' : ''}>В работу</option>
                                <option value="completed" ${p.status === 'completed' ? 'selected' : ''}>Завершена</option>
                            </select>
                        </div>
                    </div>`;
            });
            
            document.getElementById('allPleasList').innerHTML = html || '<p style="text-align:center; padding:20px;">Заявок для вашей специализации пока нет</p>';
        }

        async function createNews() {
            const title = document.getElementById('newsTitle').value;
            const content = document.getElementById('newsContent').value;

            if (!title || !content) {
                alert("Заполните заголовок и текст!");
                return;
            }

            const response = await fetch(API_URL + 'news/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + accessToken 
                },
                body: JSON.stringify({ title, content })
            });

            if (response.ok) {
                alert('Новость опубликована!');
                document.getElementById('newsTitle').value = '';
                document.getElementById('newsContent').value = '';
                // Сигналы в Django автоматически отправят Push, когда новость сохранится в БД
            } else {
                const data = await response.json();
                alert('Ошибка: ' + JSON.stringify(data));
            }
        }

        async function updateStatus(pleaId, newStatus) {
            const response = await fetch(`${API_URL}pleas/${pleaId}/`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + accessToken 
                },
                body: JSON.stringify({ status: newStatus })
            });

            if (response.ok) {
                console.log('Статус обновлен');
                fetchAllPleas();
                fetchStats(); // Перезагружаем статистику
            } else {
                alert('Ошибка при обновлении статуса');
            }
        }

        async function fetchStats() {
            try {
                const response = await fetch(API_URL + 'pleas/stats/', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });

                if (!response.ok) {
                    // Если доступа нет, просто скрываем блок статистики
                    document.querySelector('.stats-container').style.display = 'none';
                    return;
                }

                const data = await response.json();
                
                // Используем оператор || 0, чтобы точно не было undefined
                document.getElementById('statNew').innerText = data.new || 0;
                document.getElementById('statProgress').innerText = data.in_progress || 0;
                document.getElementById('statCompletedToday').innerText = data.completed_today || 0;
                document.getElementById('statTotal').innerText = data.total || 0;
            } catch (err) {
                console.error("Ошибка статистики:", err);
            }
        }
        fetchStats();
        fetchAllPleas();

    </script>
</body>
</html>
