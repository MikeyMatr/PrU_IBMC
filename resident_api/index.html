<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет жителя</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; line-height: 1.6; }
        .card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .hidden { display: none; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
        #logoutBtn { background: #dc3545; }
    </style>
</head>
<body>

    <!-- ФОРМА ВХОДА -->
     <!-- Измененный блок входа и регистрации -->
    <div id="loginSection">
        <div id="authTitle"><h2>Вход в систему ЖЭУ</h2></div>
        
        <input type="text" id="username" placeholder="Логин">
        <input type="email" id="email" class="hidden" placeholder="Email (для регистрации)">
        <input type="password" id="password" placeholder="Пароль">
        
        <div id="loginActions">
            <button onclick="login()">Войти</button>
            <p>Нет аккаунта? <a href="#" onclick="toggleAuth(true)">Зарегистрироваться</a></p>
        </div>
        
        <div id="registerActions" class="hidden">
            <button onclick="register()">Создать аккаунт</button>
            <p>Уже есть аккаунт? <a href="#" onclick="toggleAuth(false)">Войти</a></p>
        </div>
    </div>

    <!-- ЛИЧНЫЙ КАБИНЕТ -->
    <div id="mainSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Кабинет жителя</h2>
            <button id="logoutBtn" onclick="logout()">Выйти</button>
        </div>
            <button id="adminPanelBtn" class="hidden" onclick="window.location.href='admin_panel.html'" style="background: #28a745; margin-right: 10px;">Панель Диспетчера</button>
            <button id="logoutBtn" onclick="logout()">Выйти</button>

        <h3>Оставить заявку</h3>
        <div class="card">
            <select id="pleaCategory">
                <option value="plumber">Сантехник</option>
                <option value="electrician">Электрик</option>
            </select>
            <input type="text" id="pleaAddress" placeholder="Улица, номер дома">
            <input type="text" id="pleaApartment" placeholder="Квартира">
            <textarea id="pleaDesc" placeholder="Опишите проблему..."></textarea>
            <button onclick="createPlea()">Отправить заявку</button>
        </div>

        <h3>Новости дома</h3>
        <div id="newsList">Загрузка новостей...</div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/';
        let accessToken = localStorage.getItem('access');
    
        let isRegisterMode = false;

        function toggleAuth(isReg) {
            isRegisterMode = isReg;
            document.getElementById('authTitle').innerHTML = isReg ? '<h2>Регистрация жителя</h2>' : '<h2>Вход в систему ЖЭУ</h2>';
            document.getElementById('email').classList.toggle('hidden', !isReg);
            document.getElementById('loginActions').classList.toggle('hidden', isReg);
            document.getElementById('registerActions').classList.toggle('hidden', !isReg);
        }

        async function register() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const email = document.getElementById('email').value;

            const response = await fetch(API_URL + 'auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass, email: email })
            });

            if (response.ok) {
                alert('Регистрация успешна! Теперь войдите.');
                toggleAuth(false);
            } else {
                const data = await response.json();
                alert('Ошибка: ' + JSON.stringify(data));
            }
        }
        // Если токен есть, показываем кабинет
        if (accessToken) showDashboard();

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const response = await fetch(API_URL + 'auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access', data.access);
                localStorage.setItem('is_staff', data.is_staff); // Сохраняем статус админа
                localStorage.setItem('role', data.role); 
                accessToken = data.access;
                showDashboard();
            } else {
                alert('Ошибка входа!');
            }
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            
            const role = localStorage.getItem('role');
            const isStaff = localStorage.getItem('is_staff') === 'true';

            console.log("Текущая роль:", role); // Это появится в консоли F12

            // Если это НЕ житель (т.е. мастер или админ), показываем кнопку
            if (isStaff || (role && role !== 'resident')) {
                console.log("Условия соблюдены, показываю кнопку");
                const adminBtn = document.getElementById('adminPanelBtn');
                adminBtn.classList.remove('hidden');
                adminBtn.innerText = (role === 'plumber' || role === 'electrician') ? 'Панель мастера' : 'Панель диспетчера';
            }
            
            fetchNews();
            fetchPleas();
        }


        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function fetchNews() {
            const response = await fetch(API_URL + 'news/', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            const news = await response.json();
            let html = '';
            news.forEach(item => {
                html += `<div class="card"><h4>${item.title}</h4><p>${item.content}</p></div>`;
            });
            document.getElementById('newsList').innerHTML = html || 'Новостей пока нет';
        }



        async function createPlea() {
            const category = document.getElementById('pleaCategory').value;
            const address = document.getElementById('pleaAddress').value;
            const apartment = document.getElementById('pleaApartment').value;
            const description = document.getElementById('pleaDesc').value;

            if (!address || !description) {
                alert("Пожалуйста, укажите адрес и описание проблемы!");
                return;
            }

            const response = await fetch(API_URL + 'pleas/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + accessToken 
                },
                body: JSON.stringify({ category, address, apartment, description })
            });

            if (response.ok) {
                alert('Заявка создана!');
                document.getElementById('pleaAddress').value = '';
                document.getElementById('pleaApartment').value = '';
                document.getElementById('pleaDesc').value = '';
                fetchPleas();
            }
        }
    </script>
</body>
</html>
